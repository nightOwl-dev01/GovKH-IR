[project]
name = "govkh-crawler"
version = "0.1.0"
description = "Official-source crawling pipeline for GovKH Search (collection, provenance, dedup, manifest)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
govkh-crawler = "govkh_crawler.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["govkh_crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
